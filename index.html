<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Map Size Test Website</title>
    <meta name="build-timestamp" content="1763051626736">
    <meta name="build-version" content="1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css?v=1763051626736">
    <!-- Google Maps API -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAyk75jjPkzYuY-wlLQDuSLO4XTQ8iH9xI&libraries=places"></script>
    <!-- Leaflet (OpenStreetMap) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    
    <main>
        <div class="division division-0" id="division-undefined" style="position: relative; width: 100%; box-sizing: border-box; margin: 0 auto; min-height: 450px; padding: 0 24px 24px 24px; ; display: block; clear: both; overflow: hidden;"><div class="division-content" style="display: flex; align-items: center; justify-content: center; height: 100%; width: 100%; color: #9ca3af; font-size: 16px;"><p>This division is empty</p></div></div>
    </main>
    <script>
        // Cache busting and auto-refresh mechanism
        const CURRENT_BUILD_TIMESTAMP = 1763051626736;
        const CURRENT_BUILD_VERSION = 1;
        
        // Check for updates every 30 seconds when page is visible
        let updateCheckInterval;
        
        function checkForUpdates() {
            // Only check for updates if the page is visible to avoid unnecessary requests
            if (document.visibilityState === 'visible') {
                fetch(window.location.href, { 
                    method: 'HEAD',
                    cache: 'no-cache'
                })
                .then(response => {
                    // Get build timestamp from response headers or try a different approach
                    return fetch('/?checkVersion=' + Date.now(), { cache: 'no-cache' });
                })
                .then(response => response.text())
                .then(html => {
                    // Extract build timestamp from the fetched HTML
                    const timestampMatch = html.match(/name="build-timestamp" content="(d+)"/);
                    const versionMatch = html.match(/name="build-version" content="(d+)"/);
                    
                    if (timestampMatch) {
                        const serverTimestamp = parseInt(timestampMatch[1]);
                        const serverVersion = versionMatch ? parseInt(versionMatch[1]) : 1;
                        
                        // If server has newer content, reload the page
                        if (serverTimestamp > CURRENT_BUILD_TIMESTAMP || serverVersion > CURRENT_BUILD_VERSION) {
                            console.log('🔄 New website version detected, refreshing page...');
                            window.location.reload(true);
                        }
                    }
                })
                .catch(error => {
                    // Silently handle errors to avoid console spam
                    console.log('Update check failed:', error);
                });
            }
        }
        
        // Start checking for updates when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('map-test.example.com - Home page loaded (build: 1763051626736)');
            
            // Check for updates immediately and then every 30 seconds
            checkForUpdates();
            updateCheckInterval = setInterval(checkForUpdates, 30000);
            
            // Stop checking when page becomes hidden to save resources
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') {
                    clearInterval(updateCheckInterval);
                } else {
                    // Resume checking when page becomes visible again
                    updateCheckInterval = setInterval(checkForUpdates, 30000);
                    checkForUpdates(); // Check immediately
                }
            });
        });
    </script>
</body>
</html>
